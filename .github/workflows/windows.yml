name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Download offline Vosk model and native runtime
        shell: pwsh
        run: ./scripts/prepare-assets.ps1
      - name: Format Rust sources for compilation
        shell: pwsh
        working-directory: src-tauri
        run: cargo fmt
      - name: Unit tests
        shell: pwsh
        working-directory: src-tauri
        run: cargo test
      - name: Install Tauri CLI
        shell: pwsh
        run: cargo install tauri-cli --version '^2' --locked
      - name: Build NSIS installer and desktop executable
        shell: pwsh
        working-directory: src-tauri
        run: cargo tauri build --bundles nsis
      - name: Create portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = Join-Path $env:RUNNER_TEMP 'voice-input-portable'
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item 'src-tauri/target/release/voice-input.exe' $portable
          Copy-Item 'src-tauri/resources/*.dll' $portable
          Copy-Item 'src-tauri/resources/models' (Join-Path $portable 'models') -Recurse
          Compress-Archive -Path (Join-Path $portable '*') -DestinationPath 'voice-input-windows-portable.zip' -Force
      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: voice-input-windows-portable
          path: voice-input-windows-portable.zip
          if-no-files-found: error
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: voice-input-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
