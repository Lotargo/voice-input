[package]
name = "voice-input"
version = "0.1.0"
description = "Offline Russian voice dictation for Windows"
authors = ["Lotargo"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "voice_input_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
cpal = "0.15"
dunce = "1"
earshot = "1.2"
libloading = "0.8"
rustfft = "6.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
uiautomation = "0.25"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
