[package]
name = "voice-input"
version = "0.4.2"
default-run = "voice-input"
description = "Offline Russian voice dictation for Windows"
authors = ["Lotargo"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "voice_input_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
base64 = "0.23"
minisign-verify = "0.3"
semver = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
cpal = "0.18.2"
nnnoiseless = { version = "0.5.2", default-features = false }
dunce = "1"
earshot = "1.2"
libloading = "0.8"
rustfft = "6.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "system-proxy"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
sha2 = "0.10"
sherpa-onnx = "=2.0.1"
ort-sys = { version = "=2.0.0-rc.11", default-features = false, features = ["disable-linking"] }

[features]
model-tools = []

[[bin]]
name = "model-check"
path = "src/bin/model-check.rs"
required-features = ["model-tools"]

[target.'cfg(windows)'.dependencies]
uiautomation = "0.25"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 16
lto = "thin"
strip = true
panic = "abort"
